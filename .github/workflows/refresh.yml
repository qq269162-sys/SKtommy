name: Refresh discount pages

# KRX 正规盘 15:30 KST 收盘(06:30 UTC)。留 40 分钟给收盘结算,07:10 UTC 跑。
# 韩国周一至周五开市,UTC 07:10 与 KST 同日,故 cron 用 1-5。
on:
  schedule:
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate discount page
        run: |
          mkdir -p docs
          # AlphaSquare 优先;若其接口拒绝数据中心 IP 或结构变动,退回 Yahoo。
          if ! python3 sk-discount html --source alphasquare -o docs/index.html; then
            echo "::warning::AlphaSquare 取数失败,改用 Yahoo Finance"
            python3 sk-discount html --source yahoo -o docs/index.html
          fi

      - name: Regenerate ownership page
        run: python3 sk-discount ownership --html docs/ownership.html

      - name: Commit if the data changed
        run: |
          # 每次生成都会写入新的构建时间戳,所以直接比对必然有 diff。
          # 把时间戳行剔掉再比,只有行情/NAV 真的变了才提交。
          changed=0
          for f in docs/index.html docs/ownership.html; do
            if ! git cat-file -e "HEAD:$f" 2>/dev/null; then
              changed=1; continue            # 新文件
            fi
            git show "HEAD:$f" | grep -v '构建 ' > /tmp/old.html
            grep -v '构建 ' "$f" > /tmp/new.html
            cmp -s /tmp/old.html /tmp/new.html || changed=1
          done
          if [ "$changed" -eq 0 ]; then
            echo "行情与 NAV 均未变化(非交易日或数据未更新),跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/ownership.html
          git commit -m "chore: refresh discount pages ($(date -u +%F))"
          git push
